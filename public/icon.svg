<!-- jargon · iOS app icon master · 1024x1024
     Background: #C2410C marker orange (signature)
     Mark: // j in white, IBM Plex Mono Medium
     iOS will apply its own rounded-square mask; SVG includes 22.37% radius (iOS standard)
     For production: outline text and export at iOS-required sizes -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="jargon app icon">
  <!-- iOS rounded-square background -->
  <rect width="1024" height="1024" rx="229" fill="#C2410C"/>
  <!-- Mark -->
  <text x="512" y="640"
        text-anchor="middle"
        font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
        font-weight="500"
        font-size="480"
        letter-spacing="-0.02em"
        fill="#fafafa">// j</text>
</svg>
