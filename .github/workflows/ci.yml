# Source-only checks for the canonical Jargon repo.
# No credentials, hosted inference, paid calls, or deployment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and component tests
        run: npm test
      - name: Check TypeScript and production bundle
        run: npm run build
        env:
          # Harmless placeholders for Vite's public compile-time configuration.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
