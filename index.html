<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS apple-touch-icon: SVG first (newer iOS prefers it for sharpness) +
         180x180 PNG fallback for iOS < 17.4 which rejects SVG icons. -->
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- Theme color: signature violet matches the manifest theme_color so the
         Add-to-Home-Screen install + standalone mode read as one brand surface. -->
    <meta name="theme-color" content="#C2410C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Speak the room." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- v0.1 brand: added Plex Sans Light italic (300i) for the splash tagline
         "Speak the room." and Plex Mono SemiBold (600) for the wordmark fallback
         + small-size `// j` per BRAND-v0.1.html §03. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,300&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <title>jargon</title>
  </head>
  <body class="bg-bg-base text-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.error('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
